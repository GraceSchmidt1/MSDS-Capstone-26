# Stage 1 regression on engagement rate: single source of settings.
# Paths are relative to the repo root. Change `master` to point a run at a new master version.

master: data/Hidalga_Master_Data_v3.xlsx
posts_sheet: Social Posts (unified)
linkedin_detail_sheet: LinkedIn Posts (detail)

target: ENGAGEMENT_RATE_UNIFIED_PCT     # (reactions + comments + shares + clicks) / impressions x 100

platforms: [Facebook, Instagram, LinkedIn]   # one model each (main analysis); "pooled" = check

# Canonical tag vocabularies (Q1 ICP Segments & Content Pillar Reference Guide)
icp_segments:
  - Oncology Clinic Leader
  - Oncology Financial Leader
  - Oncology Operations Leader
  - Oncology Technical Leader
pillars:
  - Events & Partnerships
  - Patient-Centered Storytelling
  - Product Development & Innovations
  - Team Spotlights & Company Culture
  - Thought Leadership & Industry Insights

# Reference (omitted) categories. 378 of 391 posts carry exactly one pillar, so the five pillar
# 0/1 columns sum to ~1 and are near-collinear with the intercept; one must be the reference.
# ICP tags vary more per post (1-3), so all four are kept; collinearity is checked (VIF) in step 2.
pillar_reference: Thought Leadership & Industry Insights
icp_reference: null

# Formats per platform, written out so a new master can't silently change the categories.
# Any format not listed here raises an error. Counts in v3 for reference.
formats:
  reference: Image
  Facebook: [Image, Multi-Image, Video, Link]                                # 79 / 22 / 15 / 8
  Instagram: [Image, Carousel, Video]                                        # 88 / 28 / 14
  LinkedIn: [Image, Link, Video, Document, Multi-Image, Simple Status]       # 77 / 18 / 13 / 13 / 10 / 6

# Timing, kept coarse (EDA: finer slots too thin). Times are US Central.
timing:
  after_hour: 11          # AFTER_11 = 1 if posted at/after 11:00

# Feature groups in the main specification.
features:
  reach: [log2_impressions]          # coefficient = change in rate (pts) per doubling of impressions
  timing: [WEEKEND, AFTER_11]
  linkedin_only: [BOOSTED]           # LinkedIn post was also run as a paid boost
  sensitivity_only: [IN_EXPERIMENT_PERIOD]   # collinear with format; excluded from main spec

seed: 26

# Cross-validation shared by every model (repeated K-fold; folds built over content pieces).
cv:
  n_splits: 5
  n_repeats: 10

# Regularized models (step 3). Features are standardized inside each fit. The penalty is tuned by
# an inner K-fold on the training posts only (nested CV), so outer CV scores stay honest.
regularization:
  inner_splits: 5
  ridge_alpha_grid: {min_exp: -2, max_exp: 4, num: 61}    # alphas = 10^linspace(min_exp, max_exp, num)
  n_alphas: 100                                           # lasso / elastic net path length
  l1_ratios: [0.1, 0.25, 0.5, 0.75, 0.9]                  # elastic net mix (1.0 would be pure lasso)
  max_iter: 50000

# Step 4: how much to trust each effect, and how much each feature matters.
stability:
  n_boot: 500                 # bootstrap refits (posts resampled; whole content pieces for pooled)
  models: [Lasso, Elastic net, Ridge]   # penalty fixed at the value chosen on all posts
permutation:
  model: Elastic net          # scored on the shared outer CV splits (nested tuning, as in step 3)
  n_repeats: 10               # shuffles per feature per split

# Step 5: sensitivity runs. Each variant changes ONE thing relative to the main specification.
# Run with:  python -m modeling.run_sensitivity --tag step5_sensitivity
sensitivity:
  model: Elastic net                # regularized model refit per variant (plus OLS)
  key_features:                     # effects whose robustness is summarized (step 4 findings + checks)
    - "log2_impressions"            # quoted: "Format: X" would otherwise parse as a YAML mapping
    - "Format: Carousel"
    - "Format: Document"
    - "Format: Multi-Image"
    - "Format: Video"
    - "Format: Link"
    - "ICP: Oncology Financial Leader"
  variants:
    main: {}
    experiment_period: {add_experiment_flag: true}
    impression_weighted: {weights: impressions}      # rate precision grows with impressions
    log1p_target: {target_transform: log1p}          # effects reported in pts at the platform mean
    no_reach_control: {drop_features: [log2_impressions]}
    drop_most_influential: {drop_top_influential: 1} # largest Cook's D per model in the main OLS

# Stage 1 classification: high vs. low engagement. A label rule is fit on training posts only and
# applied to held-out posts, separately per platform ("high" always means high for that platform).
classification:
  main_label: reach_adjusted
  labels:
    reach_adjusted: {type: reach_adjusted}   # rate above what reach alone predicts (median residual of a
                                             # rate ~ log2(impressions) fit), i.e. beat expectation for its reach
    above_median: {type: quantile, q: 0.5}   # rate above the platform median
    top_tercile: {type: quantile, q: 0.6667} # rate in the platform's top third
    reach_spline: {type: reach_spline, n_knots: 4} # as reach_adjusted, but a cubic spline in log2(impressions)
                                             # (4 knots = 2 interior) so curved reach patterns are removed too
  logistic:
    max_iter: 1000              # plain (unpenalized) logistic; non-convergence is recorded per CV split
  tree:
    max_depth: 3                # shallow, so the rules stay readable
    min_samples_leaf: 10        # no rule rests on fewer than 10 posts
  # Step C3: penalized logistic. Features standardized inside each fit; C (= 1 / penalty strength) tuned
  # by log loss on an inner K-fold of the training posts only (nested CV), as in the regression's step 3.
  regularization:
    inner_splits: 5
    C_grid: {min_exp: -4, max_exp: 2, num: 31}   # Cs = 10^linspace(min_exp, max_exp, num)
    l1_ratios: [0.1, 0.25, 0.5, 0.75, 0.9]       # elastic net mix (1.0 would be pure lasso)
    max_iter: 20000
    saga_tol: 1.0e-5                             # lasso / elastic net solver tolerance. vs 1e-6: identical CV scores,
                                                 # penalties and odds ratios, ~1.7x faster (1e-4 shifted one split's tuning)
  forest:                       # random forest benchmark (evaluation framework item 2); not tuned
    n_estimators: 300
    min_samples_leaf: 5
    max_features: sqrt
  stability:
    n_boot: 500                 # bootstrap refits (whole content pieces resampled for pooled)
    models: [Lasso logistic, Elastic net logistic, Ridge logistic]   # penalty fixed at the full-data value
  permutation:
    model: Elastic net logistic # scored on the shared outer splits (labels and penalty refit per split)
    n_repeats: 10               # shuffles per feature per split

# Where run folders are written: outputs/runs/<YYYY-MM-DD>_<tag>/
output_dir: outputs/runs
