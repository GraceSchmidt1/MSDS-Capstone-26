# Stage 1 regression on engagement rate: single source of settings.
# Paths are relative to the repo root. Change `master` to point a run at a new master version.

master: data/Hidalga_Master_Data_v3.xlsx
posts_sheet: Social Posts (unified)
linkedin_detail_sheet: LinkedIn Posts (detail)

target: ENGAGEMENT_RATE_UNIFIED_PCT     # (reactions + comments + shares + clicks) / impressions x 100

platforms: [Facebook, Instagram, LinkedIn]   # one model each (main analysis); "pooled" = check

# Canonical tag vocabularies (Q1 ICP Segments & Content Pillar Reference Guide)
icp_segments:
  - Oncology Clinic Leader
  - Oncology Financial Leader
  - Oncology Operations Leader
  - Oncology Technical Leader
pillars:
  - Events & Partnerships
  - Patient-Centered Storytelling
  - Product Development & Innovations
  - Team Spotlights & Company Culture
  - Thought Leadership & Industry Insights

# Reference (omitted) categories. 378 of 391 posts carry exactly one pillar, so the five pillar
# 0/1 columns sum to ~1 and are near-collinear with the intercept; one must be the reference.
# ICP tags vary more per post (1-3), so all four are kept; collinearity is checked (VIF) in step 2.
pillar_reference: Thought Leadership & Industry Insights
icp_reference: null

# Formats per platform, written out so a new master can't silently change the categories.
# Any format not listed here raises an error. Counts in v3 for reference.
formats:
  reference: Image
  Facebook: [Image, Multi-Image, Video, Link]                                # 79 / 22 / 15 / 8
  Instagram: [Image, Carousel, Video]                                        # 88 / 28 / 14
  LinkedIn: [Image, Link, Video, Document, Multi-Image, Simple Status]       # 77 / 18 / 13 / 13 / 10 / 6

# Timing, kept coarse (EDA: finer slots too thin). Times are US Central.
timing:
  after_hour: 11          # AFTER_11 = 1 if posted at/after 11:00

# Feature groups in the main specification.
features:
  reach: [log2_impressions]          # coefficient = change in rate (pts) per doubling of impressions
  timing: [WEEKEND, AFTER_11]
  linkedin_only: [BOOSTED]           # LinkedIn post was also run as a paid boost
  sensitivity_only: [IN_EXPERIMENT_PERIOD]   # collinear with format; excluded from main spec

seed: 26
